name: Verify commands

# Runs every command shown on the site against real engines and fails the
# build on any error. On a passing push to main it also rolls the footer
# "Checked against" stamp to the current month (only when the month changed).
# The stamp goes out as a pull request, never as a direct push to main, so it
# works with a branch ruleset that requires pull requests. The repository
# setting "Allow GitHub Actions to create and approve pull requests" must be on.
# A pull request opened with the default token does not start the pull_request
# workflows, so close and reopen the stamp pull request once to run the checks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start PostgreSQL 18
        run: |
          docker run -d --name ci-pg \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=shop \
            postgres:18 -c shared_preload_libraries=pg_stat_statements
          until docker exec ci-pg pg_isready -U postgres -d shop; do sleep 2; done

      - name: Start MySQL 8.4
        run: |
          docker run -d --name ci-my \
            -e MYSQL_ROOT_PASSWORD=rootpass -e MYSQL_DATABASE=shop \
            mysql:8.4 --server-id=1 --log-bin=mysql-bin \
            --gtid-mode=ON --enforce-gtid-consistency=ON --binlog-format=ROW
          until docker exec ci-my mysqladmin ping -uroot -prootpass --silent; do sleep 2; done

      - name: Start MongoDB 8 (single-node replica set)
        run: |
          docker run -d --name ci-mo mongo:8.0 mongod --replSet rs0 --bind_ip_all
          until docker exec ci-mo mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'; do sleep 2; done
          docker exec ci-mo mongosh --quiet --eval 'rs.initiate()'
          until docker exec ci-mo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 2; done

      - name: Seed the demo schema
        run: |
          docker exec -i ci-pg psql -U postgres -d shop -v ON_ERROR_STOP=1 < scripts/ci-seed.sql
          docker exec -i ci-my mysql -uroot -prootpass shop < scripts/ci-seed-mysql.sql
          docker cp scripts/ci-seed-mongo.js ci-mo:/tmp/ci-seed-mongo.js
          docker exec ci-mo mongosh --quiet /tmp/ci-seed-mongo.js

      - name: Extract commands from the site
        run: python3 scripts/extract-commands.py --root . --out ci-out

      - name: Check engine pages stay consistent
        run: python3 scripts/check-engines.py --root .

      - name: Test the query coach rules
        run: node scripts/test-coach.mjs

      - name: Test the config checker, EXPLAIN reader and health report
        run: |
          node scripts/test-config.mjs
          node scripts/test-plan.mjs
          node scripts/test-health.mjs

      - name: Run the health check scripts on the live servers
        run: |
          docker exec ci-pg psql -U postgres -d shop -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'
          docker exec -i ci-pg psql -U postgres -d shop -At -F'|' -X < assets/health/health-pg.sql > /tmp/health-pg.txt
          docker exec -i ci-my mysql -uroot -prootpass -B -N < assets/health/health-my.sql > /tmp/health-my.txt
          docker cp assets/health/health-mo.js ci-mo:/tmp/health-mo.js
          docker exec ci-mo mongosh --quiet /tmp/health-mo.js > /tmp/health-mo.txt
          head -40 /tmp/health-pg.txt /tmp/health-my.txt /tmp/health-mo.txt
          node scripts/test-health.mjs /tmp/health-pg.txt /tmp/health-my.txt /tmp/health-mo.txt

      - name: Run PostgreSQL commands
        run: docker exec -i ci-pg psql -U postgres -d shop -v ON_ERROR_STOP=1 < ci-out/pg.sql

      - name: Run MySQL commands
        run: docker exec -i ci-my mysql -uroot -prootpass shop < ci-out/mysql.sql

      - name: Run MongoDB commands
        run: |
          docker cp ci-out/mongo.js ci-mo:/tmp/mongo.js
          docker exec ci-mo mongosh --quiet shop /tmp/mongo.js

      - name: Run shell commands
        run: |
          docker cp ci-out/shell-pg.sh ci-pg:/tmp/shell-pg.sh
          docker exec ci-pg bash /tmp/shell-pg.sh
          docker cp ci-out/shell-my.sh ci-my:/tmp/shell-my.sh
          docker exec ci-my bash /tmp/shell-my.sh

      - name: Open a pull request for the Checked against stamp
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update-checked-stamp.py
          if [ -z "$(git status --porcelain)" ]; then
            echo "Stamp is current, nothing to do."
            exit 0
          fi
          BRANCH="stamp/$(date -u +%Y-%m)"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "A pull request for $BRANCH is already open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Update Checked against stamp"
          git push --force origin "$BRANCH"
          if ! gh pr create --base main --head "$BRANCH" \
              --title "Update Checked against stamp ($(date -u '+%b %Y'))" \
              --body "Monthly roll of the footer stamp, made by scripts/update-checked-stamp.py after a passing run on main. Close and reopen this pull request once to start the checks."; then
            echo "::error::Could not open the pull request. Turn on Settings, Actions, General, Allow GitHub Actions to create and approve pull requests."
            exit 1
          fi
